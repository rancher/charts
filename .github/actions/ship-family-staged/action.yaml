name: Ship family staged
description: >-
  Stamps, checks, packages and pushes the charts of a family to the staging
  registry, and tells rancher/charts to ship and index them in one pull request.

# For the workflow of a chart repository whose charts are released together, such
# as fleet, fleet-agent and fleet-crd. For one chart, use ship-staged. The steps
# run in the job of the caller, after its checkout, so the OIDC token is the one
# of the caller and every Vault path is under the repository that calls this
# action. The caller prepares the chart folders (the app versions and the image
# tags in them) and may give the one version they all take: without it,
# cargueiro chart-version works it out from the appVersion of the main chart and
# the versions already released. The template at
# .github/templates/prepare-charts-family.sh does that for a release tag: copy it
# into the repository of the charts and adapt it.
#
# The caller job needs `id-token: write`, to log in to Vault. The repository
# needs, under its own path in Vault, the staging registry credentials
# (rancher-prime-stg-registry/credentials) and the credentials of a GitHub App
# installed on rancher/charts that can send a repository_dispatch
# (github/app-credentials).
#
# Everything that can fail on credentials is done before the push, because a
# version that is pushed stays in the registry. If the push stops halfway, run
# the job again: the charts that are in the registry with the same content are
# skipped, and the rest are pushed.

inputs:
  chart-dirs:
    description: >-
      The folders of every chart of the family, one to a line, each with its
      Chart.yaml. They are stamped in place.
    required: true
  family:
    description: The name of the family in rules.yaml whose charts are in chart-dirs, such as fleet.
    required: true
  version:
    description: >-
      The final version of every chart of the family, as in their Chart.yaml (with
      the +). Leave it out to have it worked out from the appVersion of the main
      chart and the versions already released.
    required: false
    default: ""

outputs:
  family:
    description: The name of the family that was pushed.
    value: ${{ inputs.family }}
  references:
    description: The references that were pushed, one to a line, in the order of the family.
    value: ${{ steps.push.outputs.references }}
  version:
    description: The version of the charts that were pushed, the one given or the one worked out.
    value: ${{ steps.push.outputs.version }}

runs:
  using: composite
  steps:
    # Everything that depends on the caller is checked and printed first, so a
    # failure later can be read against it.
    - name: Check the caller
      shell: bash
      env:
        CHART_DIRS: ${{ inputs.chart-dirs }}
        FAMILY: ${{ inputs.family }}
        VERSION: ${{ inputs.version }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
      run: |
        mapfile -t dirs < <(printf '%s\n' "$CHART_DIRS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d')

        echo "repository:   ${GITHUB_REPOSITORY}"
        echo "workflow:     ${WORKFLOW_REF}"
        echo "ref:          ${GITHUB_REF} (${GITHUB_EVENT_NAME})"
        echo "family:       ${FAMILY}"
        echo "version:      ${VERSION:-worked out by cargueiro chart-version}"
        printf 'chart folder: %s\n' "${dirs[@]}"
        echo "Vault paths:  github/repo/${GITHUB_REPOSITORY}/{rancher-prime-stg-registry/credentials,github/app-credentials}"
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::The job has no OIDC token, so it cannot log in to Vault. Add 'id-token: write' to the permissions of the job that calls this action."
          exit 1
        fi
        if [ -z "$FAMILY" ] || [ "${#dirs[@]}" -eq 0 ]; then
          echo "::error::Give the family and the folders of its charts, one to a line. To ship one chart, use the ship-staged action."
          exit 1
        fi
        for dir in "${dirs[@]}"; do
          if [ ! -f "${dir}/Chart.yaml" ]; then
            echo "::error::There is no Chart.yaml in '${dir}'. The chart folders are folders in the workspace of the job, and the checkout must come before this action."
            exit 1
          fi
        done

    - name: Load the credentials from Vault
      uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # main
      with:
        secrets: |
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials registry | STAGING_REGISTRY ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username | CARGUEIRO_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password | CARGUEIRO_PASSWORD ;
          secret/data/github/repo/${{ github.repository }}/github/app-credentials appId | APP_ID ;
          secret/data/github/repo/${{ github.repository }}/github/app-credentials privateKey | PRIVATE_KEY

    # Names only, never values. A name that is empty here, with the Vault step
    # green, means the field is missing from the secret.
    - name: Check the credentials and the registry
      shell: bash
      run: |
        missing=0
        for name in STAGING_REGISTRY CARGUEIRO_USERNAME CARGUEIRO_PASSWORD APP_ID PRIVATE_KEY; do
          if [ -n "${!name:-}" ]; then
            echo "${name}: loaded"
          else
            echo "::error::${name} is empty after the Vault step. Look for the field in github/repo/${GITHUB_REPOSITORY}/ in Vault."
            missing=1
          fi
        done
        [ "$missing" = 0 ] || exit 1
        echo "registry: ${STAGING_REGISTRY}"
        # cargueiro only applies its rules to this host, so any other would turn them off.
        if [ "$STAGING_REGISTRY" != "stgregistry.suse.com" ]; then
          echo "::error::The registry in Vault is not stgregistry.suse.com, so the push protections would not apply"
          exit 1
        fi

    # Token for rancher/charts only, to send the repository_dispatch. It is made
    # before the push so that a failure here leaves nothing in the registry.
    - name: Create the token for rancher/charts
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
      id: app-token
      with:
        app-id: ${{ env.APP_ID }}
        private-key: ${{ env.PRIVATE_KEY }}
        repositories: |
          charts

    - name: Log the GitHub App
      shell: bash
      env:
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
      run: echo "GitHub App ${APP_SLUG}, installation ${INSTALLATION_ID}, token for rancher/charts"

    # The latest release, while cargueiro changes often. install.sh checks the
    # download against the checksums of that release.
    - name: Install cargueiro
      shell: bash
      run: |
        curl -fsSL https://github.com/rancher/cargueiro/releases/latest/download/install.sh | sh -
        cargueiro version

    - name: Stamp, check, package and push the charts
      id: push
      shell: bash
      env:
        CHART_DIRS: ${{ inputs.chart-dirs }}
        FAMILY: ${{ inputs.family }}
        VERSION: ${{ inputs.version }}
      run: |
        set -Eeuo pipefail
        trap 'echo "::error::This failed: ${BASH_COMMAND}"' ERR

        # The step before checked that the family and the folders are there.
        mapfile -t dirs < <(printf '%s\n' "$CHART_DIRS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d')

        # Without a version it is worked out from the appVersion of the main chart
        # and the versions already released, and the charts of the family must be
        # released at the same version. Nothing is written yet.
        if [ -z "$VERSION" ]; then
          echo "::group::cargueiro chart-version"
          VERSION=$(cargueiro chart-version --family "$FAMILY" "${dirs[@]}")
          echo "::endgroup::"
          echo "version:  ${VERSION} (worked out)"
        fi

        # The dry run does every check and writes nothing, so a problem in any
        # chart stops the step before a folder is changed.
        echo "::group::cargueiro stamp (dry run)"
        cargueiro stamp --family "$FAMILY" "${dirs[@]}" --version "$VERSION" --dry-run --debug >&2
        echo "::endgroup::"
        echo "::group::cargueiro stamp"
        cargueiro stamp --family "$FAMILY" "${dirs[@]}" --version "$VERSION" >&2
        echo "::endgroup::"

        echo "::group::cargueiro check chart"
        cargueiro check chart --family "$FAMILY" "${dirs[@]}" >&2
        echo "::endgroup::"

        echo "::group::cargueiro package"
        packaged=$(cargueiro package --family "$FAMILY" "${dirs[@]}" --output-dir "$RUNNER_TEMP/ship-family-staged")
        echo "::endgroup::"
        mapfile -t archives <<< "$packaged"
        printf 'packaged: %s\n' "${archives[@]}"

        echo "::group::cargueiro push"
        pushed=$(cargueiro push --family "$FAMILY" "${archives[@]}" --registry "$STAGING_REGISTRY/rancher/catalog")
        echo "::endgroup::"
        mapfile -t references <<< "$pushed"
        printf 'pushed:   %s\n' "${references[@]}"

        {
          echo "Pushed the family ${FAMILY} ${VERSION}:"
          printf -- '- %s\n' "${references[@]}"
        } >> "$GITHUB_STEP_SUMMARY"

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

        {
          echo "references<<EOF"
          echo "$pushed"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Tell rancher/charts the family is staged
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        FAMILY: ${{ inputs.family }}
        VERSION: ${{ steps.push.outputs.version }}
      run: |
        echo "Sending chart-staged for the family ${FAMILY} ${VERSION} to rancher/charts"
        if ! gh api "repos/rancher/charts/dispatches" \
          -f event_type=chart-staged \
          -f "client_payload[family]=${FAMILY}" \
          -f "client_payload[version]=${VERSION}"; then
          echo "::error::The dispatch was refused. The App must be installed on rancher/charts with the Contents: write permission. The charts are already in the registry: send the event again with 'gh api repos/rancher/charts/dispatches -f event_type=chart-staged -f client_payload[family]=${FAMILY} -f client_payload[version]=${VERSION}', or start the chart-staged workflow of rancher/charts by hand with the same two values."
          exit 1
        fi
        echo "Sent. Follow it in the chart-staged workflow of rancher/charts."
        echo "Sent chart-staged for the family ${FAMILY} ${VERSION} to rancher/charts." >> "$GITHUB_STEP_SUMMARY"
