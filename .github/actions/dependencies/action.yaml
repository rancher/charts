        EXPECTED_CHECKSUM="62372091dd888e8c4c1c0648b6d36adc785c54b300fdb075748e59f48b3759d0"

        # Install specific version via zypper (GPG-verified repo)
        zypper --non-interactive --gpg-auto-import-keys install "$MAKE_VERSION"

