        echo "verify checksum"
        ACTUAL_CHECKSUM=$(sha256sum "$BINARY_PATH" | cut -d' ' -f1)

        echo "Expected checksum: $EXPECTED_CHECKSUM"
        echo "Actual checksum:   $ACTUAL_CHECKSUM"

        if [[ "$ACTUAL_CHECKSUM" != "$EXPECTED_CHECKSUM" ]]; then
          echo "ERROR: Checksum mismatch!"
          exit 1
        fi

        echo "Checksum verified successfully"
        echo "-------------------------------------------------------------------"

    - name: Install make
      shell: bash
      env:
        PACKAGE_VERSION: "make-4.2.1-7.3.2.x86_64"
        EXPECTED_CHECKSUM: "62372091dd888e8c4c1c0648b6d36adc785c54b300fdb075748e59f48b3759d0"
        BINARY_PATH: "/usr/bin/make"
      run: |
        echo "install make (pinned version)"
        zypper --non-interactive --gpg-auto-import-keys install "$PACKAGE_VERSION"

        echo "verify version"
        make --version | head -1 || true

        echo "verify checksum"
        ACTUAL_CHECKSUM=$(sha256sum "$BINARY_PATH" | cut -d' ' -f1)

        echo "Expected checksum: $EXPECTED_CHECKSUM"
        echo "Actual checksum:   $ACTUAL_CHECKSUM"

        if [[ "$ACTUAL_CHECKSUM" != "$EXPECTED_CHECKSUM" ]]; then
          echo "ERROR: Checksum mismatch!"
          exit 1
        fi

        echo "Checksum verified successfully"
        echo "-------------------------------------------------------------------"

    - name: Install go
      shell: bash
      env:
        PACKAGE_VERSION: "go-1.25-150000.3.46.1.x86_64"
        EXPECTED_CHECKSUM: "5545514605aa3fe16856d24a02295be754cc5d9eb0b425f9e860500409fc696b"
        BINARY_PATH: "/usr/bin/go"
      run: |
        echo "install go (pinned version)"
        zypper --non-interactive --gpg-auto-import-keys install "$PACKAGE_VERSION"

        echo "verify version"
