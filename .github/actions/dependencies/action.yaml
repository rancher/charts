name: Install Dependencies
description: Install system dependencies, gh CLI, and yq with pinned versions and checksum verification

runs:
  using: composite
  steps:
    - name: Install Docker
      shell: bash
      run: |
        echo "install docker (pinned version)"

        # Expected values
        DOCKER_VERSION="docker-28.5.1_ce-150000.243.1.x86_64"
        EXPECTED_CHECKSUM="6b92c4b659b1fcb8a4d00c25b7e28f84632e06fb91addc01c9389cc237e85a84"

        # Install specific version via zypper (GPG-verified repo)
        zypper --non-interactive --gpg-auto-import-keys install "$DOCKER_VERSION"

        # Verify version
        echo "verify version"
        docker --version

        # Verify checksum
        echo "verify checksum"
        ACTUAL_CHECKSUM=$(sha256sum /usr/bin/docker | cut -d' ' -f1)

        echo "Expected checksum: $EXPECTED_CHECKSUM"
        echo "Actual checksum:   $ACTUAL_CHECKSUM"

        if [[ "$ACTUAL_CHECKSUM" != "$EXPECTED_CHECKSUM" ]]; then
          echo "ERROR: Checksum mismatch!"
          exit 1
        fi

        echo "Checksum verified successfully"
        echo "-------------------------------------------------------------------"

    - name: Install jq
      shell: bash
      run: |
        echo "install jq (pinned version)"

        # Expected values
        JQ_VERSION="jq-1.6-150000.3.12.1.x86_64"
        EXPECTED_CHECKSUM="8142013b1470bd811e8ec6130210c8c80441a150a5643803fe9398eef65bd006"

        # Install specific version via zypper (GPG-verified repo)
