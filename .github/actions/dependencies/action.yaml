name: Install Dependencies
description: Install system dependencies, gh CLI, and yq with pinned versions and checksum verification

runs:
  using: composite
  steps:
    - name: Install Docker
      shell: bash
      env:
        PACKAGE_VERSION: "docker-28.5.1_ce-150000.245.2.x86_64"
        EXPECTED_CHECKSUM: "056edd485a58f5314d6d153cb76281bf5b5cde97c9e1ff2e0567c8b864dcae60"
        BINARY_PATH: "/usr/bin/docker"
      run: |
        echo "::group::Installing ${PACKAGE_VERSION}"
        zypper --non-interactive --gpg-auto-import-keys install "$PACKAGE_VERSION"
        echo "::endgroup::"
        echo "docker --version: $(docker --version)"

        echo "verify checksum"
        ACTUAL_CHECKSUM=$(sha256sum "$BINARY_PATH" | cut -d' ' -f1)

        $GITHUB_ACTION_PATH/verify-checksum "${PACKAGE_VERSION}" "${EXPECTED_CHECKSUM}" "${ACTUAL_CHECKSUM}" "${{ github.repository }}" || exit 1

        echo "Checksum verified successfully"
        echo "-------------------------------------------------------------------"

    - name: Install jq
      shell: bash
      env:
        PACKAGE_VERSION: "jq-1.6-150000.3.12.1.x86_64"
        EXPECTED_CHECKSUM: "8142013b1470bd811e8ec6130210c8c80441a150a5643803fe9398eef65bd006"
        BINARY_PATH: "/usr/bin/jq"
      run: |
        echo "::group::Installing ${PACKAGE_VERSION}"
        zypper --non-interactive --gpg-auto-import-keys install "$PACKAGE_VERSION"
        echo "::endgroup::"

        echo "jq --version: $(jq --version)"

        echo "verify checksum"
        ACTUAL_CHECKSUM=$(sha256sum "$BINARY_PATH" | cut -d' ' -f1)

        $GITHUB_ACTION_PATH/verify-checksum "${PACKAGE_VERSION}" "${EXPECTED_CHECKSUM}" "${ACTUAL_CHECKSUM}" "${{ github.repository }}" || exit 1

        echo "Checksum verified successfully"
        echo "-------------------------------------------------------------------"

    - name: Install git
      shell: bash
      env:
        PACKAGE_VERSION: "git-2.51.0-150600.3.15.1.x86_64"
        EXPECTED_CHECKSUM: "70a3423f84100dcbb0302f3ca6a0595dc9ca507ba3aa846136f27fe79b742d1a"
        BINARY_PATH: "/usr/bin/git"
      run: |
        echo "::group::Installing ${PACKAGE_VERSION}"
        zypper --non-interactive --gpg-auto-import-keys install "$PACKAGE_VERSION"
        echo "::endgroup::"

        echo "git --version: $(git --version)"

        echo "verify checksum"
        ACTUAL_CHECKSUM=$(sha256sum "$BINARY_PATH" | cut -d' ' -f1)

        $GITHUB_ACTION_PATH/verify-checksum "${PACKAGE_VERSION}" "${EXPECTED_CHECKSUM}" "${ACTUAL_CHECKSUM}" "${{ github.repository }}" || exit 1

        echo "Checksum verified successfully"
        echo "-------------------------------------------------------------------"

    - name: Install make
      shell: bash
      env:
        PACKAGE_VERSION: "make-4.2.1-7.3.2.x86_64"
        EXPECTED_CHECKSUM: "62372091dd888e8c4c1c0648b6d36adc785c54b300fdb075748e59f48b3759d0"
        BINARY_PATH: "/usr/bin/make"
      run: |
        echo "::group::Installing ${PACKAGE_VERSION}"
        zypper --non-interactive --gpg-auto-import-keys install "$PACKAGE_VERSION"
        echo "::endgroup::"

        echo "make --version: $(make --version | head -1)"

        echo "verify checksum"
        ACTUAL_CHECKSUM=$(sha256sum "$BINARY_PATH" | cut -d' ' -f1)

        $GITHUB_ACTION_PATH/verify-checksum "${PACKAGE_VERSION}" "${EXPECTED_CHECKSUM}" "${ACTUAL_CHECKSUM}" "${{ github.repository }}" || exit 1

        echo "Checksum verified successfully"
        echo "-------------------------------------------------------------------"

    - name: Install go
      shell: bash
      env:
        PACKAGE_VERSION: "go-1.25-150000.3.46.1.x86_64"
        EXPECTED_CHECKSUM: "cc6ce78d0a0fe951eb453e0626cfca0d9323c0f1bfffd670d561e3aaf1c869a8"
        BINARY_PATH: "/usr/bin/go"
      run: |
        echo "::group::Installing ${PACKAGE_VERSION}"
        zypper --non-interactive --gpg-auto-import-keys install "$PACKAGE_VERSION"
        echo "::endgroup::"

        echo "go version: $(go version)"

        echo "verify checksum"
        ACTUAL_CHECKSUM=$(sha256sum "$BINARY_PATH" | cut -d' ' -f1)

        $GITHUB_ACTION_PATH/verify-checksum "${PACKAGE_VERSION}" "${EXPECTED_CHECKSUM}" "${ACTUAL_CHECKSUM}" "${{ github.repository }}" || exit 1

        echo "Checksum verified successfully"
        echo "-------------------------------------------------------------------"

    - name: Install patch
      shell: bash
      env:
        PACKAGE_VERSION: "patch-2.7.6-150000.5.9.1.x86_64"
        EXPECTED_CHECKSUM: "691c5d594bc64a41a5502c4c724c9aea554d7fc67c883011c76282cd772dcaaa"
        BINARY_PATH: "/usr/bin/patch"
      run: |
        echo "::group::Installing ${PACKAGE_VERSION}"
        zypper --non-interactive --gpg-auto-import-keys install "$PACKAGE_VERSION"
        echo "::endgroup::"

        echo "patch --version: $(patch --version | head -1)"

        echo "verify checksum"
        ACTUAL_CHECKSUM=$(sha256sum "$BINARY_PATH" | cut -d' ' -f1)

        $GITHUB_ACTION_PATH/verify-checksum "${PACKAGE_VERSION}" "${EXPECTED_CHECKSUM}" "${ACTUAL_CHECKSUM}" "${{ github.repository }}" || exit 1

        echo "Checksum verified successfully"
        echo "-------------------------------------------------------------------"

    - name: Install gawk
      shell: bash
      env:
        PACKAGE_VERSION: "gawk-4.2.1-150000.3.3.1.x86_64"
        EXPECTED_CHECKSUM: "bd00f0bfa560356118968c0c3fca325276e60e4b3bb76a4eee8ddbab96405101"
        BINARY_PATH: "/usr/bin/gawk"
      run: |
        echo "::group::Installing ${PACKAGE_VERSION}"
        zypper --non-interactive --gpg-auto-import-keys install "$PACKAGE_VERSION"
        echo "::endgroup::"

        echo "gawk --version: $(gawk --version | head -1)"

        echo "verify checksum"
        ACTUAL_CHECKSUM=$(sha256sum "$BINARY_PATH" | cut -d' ' -f1)

        $GITHUB_ACTION_PATH/verify-checksum "${PACKAGE_VERSION}" "${EXPECTED_CHECKSUM}" "${ACTUAL_CHECKSUM}" "${{ github.repository }}" || exit 1

        echo "Checksum verified successfully"
        echo "-------------------------------------------------------------------"

    - name: Install yq
      shell: bash
      env:
        # renovate: datasource=github-releases depName=mikefarah/yq
        YQ_VERSION: "v4.52.5"
        YQ_BINARY: "yq_linux_amd64"
        # renovate: datasource=github-release-attachments depName=mikefarah/yq digestVersion=v4.52.5
        EXPECTED_CHECKSUM: "75d893a0d5940d1019cb7cdc60001d9e876623852c31cfc6267047bc31149fa9"
        INSTALL_PATH: "/usr/bin/yq"
      run: |
        echo "::group::Installing yq ${YQ_VERSION}"
        curl -sL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/${YQ_BINARY}" -o /tmp/yq
        echo "::endgroup::"

        echo "verify checksum"
        ACTUAL_CHECKSUM=$(sha256sum /tmp/yq | cut -d' ' -f1)

        PACKAGE_VERSION="yq-${YQ_VERSION}"
        $GITHUB_ACTION_PATH/verify-checksum "${PACKAGE_VERSION}" "${EXPECTED_CHECKSUM}" "${ACTUAL_CHECKSUM}" "${{ github.repository }}" || exit 1

        echo "install to $INSTALL_PATH"
        mv /tmp/yq "$INSTALL_PATH"
        chmod +x "$INSTALL_PATH"

        echo "yq --version: $(yq --version)"

        echo "Checksum verified successfully"
        echo "-------------------------------------------------------------------"

    - name: Install gh
      shell: bash
      env:
        # renovate: datasource=github-releases depName=cli/cli
        GH_VERSION: "v2.89.0"
        # renovate: datasource=github-release-attachments depName=cli/cli digestVersion=v2.89.0
        EXPECTED_CHECKSUM: "d0422caade520530e76c1c558da47daebaa8e1203d6b7ff10ad7d6faba3490d8"
        INSTALL_PATH: "/usr/bin/gh"
      run: |
        echo "::group::Installing gh ${GH_VERSION}"
        curl -sL "https://github.com/cli/cli/releases/download/${GH_VERSION}/gh_${GH_VERSION#v}_linux_amd64.tar.gz" -o /tmp/gh.tar.gz
        echo "::endgroup::"

        echo "verify checksum"
        ACTUAL_CHECKSUM=$(sha256sum /tmp/gh.tar.gz | cut -d' ' -f1)

        PACKAGE_VERSION="gh-${GH_VERSION}"
        $GITHUB_ACTION_PATH/verify-checksum "${PACKAGE_VERSION}" "${EXPECTED_CHECKSUM}" "${ACTUAL_CHECKSUM}" "${{ github.repository }}" || exit 1

        echo "Checksum verified successfully"

        echo "extract and install to $INSTALL_PATH"
        tar -xzf /tmp/gh.tar.gz -C /tmp
        mv "/tmp/gh_${GH_VERSION#v}_linux_amd64/bin/gh" "$INSTALL_PATH"
        chmod +x "$INSTALL_PATH"
        rm -rf /tmp/gh.tar.gz "/tmp/gh_${GH_VERSION#v}_linux_amd64"

        echo "gh --version: $(gh --version)"
        echo "-------------------------------------------------------------------"
