    - name: Install gawk
      shell: bash
      env:
        PACKAGE_VERSION: "gawk-4.2.1-150000.3.3.1.x86_64"
        EXPECTED_CHECKSUM: "bd00f0bfa560356118968c0c3fca325276e60e4b3bb76a4eee8ddbab96405101"
        BINARY_PATH: "/usr/bin/gawk"
      run: |
        echo "install gawk (pinned version)"
        zypper --non-interactive --gpg-auto-import-keys install "$PACKAGE_VERSION"

        echo "verify version"
        gawk --version | head -1 || true

        echo "verify checksum"
        ACTUAL_CHECKSUM=$(sha256sum "$BINARY_PATH" | cut -d' ' -f1)

        echo "Expected checksum: $EXPECTED_CHECKSUM"
        echo "Actual checksum:   $ACTUAL_CHECKSUM"

        if [[ "$ACTUAL_CHECKSUM" != "$EXPECTED_CHECKSUM" ]]; then
          echo "ERROR: Checksum mismatch!"
