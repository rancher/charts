name: Build Validation
description: Run all chart validation checks including release.yaml format, image tag linting, index validation, and Docker image availability checks
inputs:
  base_ref:
    description: "Base branch reference for the PR target (e.g., dev-v2.14, release-v2.13). Used to determine validation mode and fetch base branch state."
    required: true
  pr_number:
    description: "Pull request number from github.event.pull_request.number. Used to fetch and checkout the PR head for validation."
    required: true
  app_token:
    description: "GitHub App token generated from Vault secrets. Optional - may be empty for fork PRs. Required for release PR validation API calls via gh CLI."
    required: false
  docker_username:
    description: "Docker Hub username from Vault secrets. Optional - may be empty for fork PRs. Used to authenticate for Docker image availability checks."
    required: false
  docker_password:
    description: "Docker Hub password from Vault secrets. Optional - may be empty for fork PRs. Used to authenticate for Docker image availability checks."
    required: false
  github_token:
    description: "GitHub token for authenticated API requests. Used by pull-scripts for gh api calls to avoid rate limiting."
    required: false

runs:
  using: composite
  steps:
    # ====================================================================
    # Input Validation
    # Verify all required inputs are provided and display build context
    # ====================================================================
    - name: Validate inputs and display build context
      shell: bash
      env:
        BASE_REF: ${{ inputs.base_ref }}
        PR_NUMBER: ${{ inputs.pr_number }}
        APP_TOKEN: ${{ inputs.app_token }}
        DOCKER_USERNAME: ${{ inputs.docker_username }}
        DOCKER_PASSWORD: ${{ inputs.docker_password }}
      run: |
        echo "================================================================="
        echo "Build Validation - PR #${PR_NUMBER} → ${BASE_REF}"
        echo "================================================================="

        # Validate required inputs
        VALIDATION_FAILED=0

        if [[ -z "$BASE_REF" ]]; then
          echo "ERROR: base_ref input is required but not provided"
          VALIDATION_FAILED=1
        fi

        if [[ -z "$PR_NUMBER" ]]; then
          echo "ERROR: pr_number input is required but not provided"
          VALIDATION_FAILED=1
        fi

        if [[ $VALIDATION_FAILED -eq 1 ]]; then
          echo "Input validation failed"
          exit 1
        fi

        # Check optional credentials (from Vault - may be empty for fork PRs)
        if [[ -z "$APP_TOKEN" ]]; then
          echo "WARNING: app_token is empty (expected for fork PRs)"
          echo "  Impact: Release PR validation will be limited"
        fi

        if [[ -z "$DOCKER_USERNAME" ]] || [[ -z "$DOCKER_PASSWORD" ]]; then
          echo "WARNING: Docker credentials are empty (expected for fork PRs)"
          echo "  Impact: Docker image checks may be rate-limited"
        fi

        # Log validated inputs
        echo "Inputs validated:"
        echo "  base_ref: ${BASE_REF}"
        echo "  pr_number: ${PR_NUMBER}"
        echo "  app_token: $(if [[ -n "$APP_TOKEN" ]]; then echo '***REDACTED***'; else echo '(empty)'; fi)"
        echo "  docker_username: $(if [[ -n "$DOCKER_USERNAME" ]]; then echo '***REDACTED***'; else echo '(empty)'; fi)"
        echo "  docker_password: $(if [[ -n "$DOCKER_PASSWORD" ]]; then echo '***REDACTED***'; else echo '(empty)'; fi)"
        echo "================================================================="

    # ====================================================================
    # Dependency Check
    # Verify all required tools are installed and available
    # ====================================================================
    - name: Verify required dependencies are installed
      shell: bash
      run: |
        echo "Verifying dependencies..."
        DEPS_MISSING=0

        # Check each required tool
        if ! command -v docker &> /dev/null; then
          echo "ERROR: docker not found"
          DEPS_MISSING=1
        else
          echo "✓ docker: $(docker --version)"
        fi

        if ! command -v jq &> /dev/null; then
          echo "ERROR: jq not found"
          DEPS_MISSING=1
        else
          echo "✓ jq: $(jq --version)"
        fi

        if ! command -v git &> /dev/null; then
          echo "ERROR: git not found"
          DEPS_MISSING=1
        else
          echo "✓ git: $(git --version)"
        fi

        if ! command -v make &> /dev/null; then
          echo "ERROR: make not found"
          DEPS_MISSING=1
        else
          echo "✓ make: $(make --version | head -1)"
        fi

        if ! command -v go &> /dev/null; then
          echo "ERROR: go not found"
          DEPS_MISSING=1
        else
          echo "✓ go: $(go version)"
        fi

        if ! command -v patch &> /dev/null; then
          echo "ERROR: patch not found"
          DEPS_MISSING=1
        else
          echo "✓ patch: $(patch --version | head -1)"
        fi

        if ! command -v gawk &> /dev/null; then
          echo "ERROR: gawk not found"
          DEPS_MISSING=1
        else
          echo "✓ gawk: $(gawk --version | head -1)"
        fi

        if [[ $DEPS_MISSING -eq 1 ]]; then
          echo ""
          echo "ERROR: Missing dependencies. Ensure dependencies action runs before this action."
          exit 1
        fi

        echo "All dependencies verified"
        echo "================================================================="

    # ====================================================================
    # Script Verification
    # Ensure core scripts (pull-scripts, version) exist before proceeding
    # ====================================================================
    - name: Verify required scripts are present
      shell: bash
      run: |
        echo "Checking required scripts..."
        SCRIPTS_MISSING=0

        if [[ ! -f scripts/pull-scripts ]]; then
          echo "ERROR: scripts/pull-scripts not found"
          SCRIPTS_MISSING=1
        else
          echo "✓ scripts/pull-scripts exists"
        fi

        if [[ ! -f scripts/version ]]; then
          echo "ERROR: scripts/version not found"
          SCRIPTS_MISSING=1
        else
          echo "✓ scripts/version exists"
        fi

        if [[ $SCRIPTS_MISSING -eq 1 ]]; then
          echo ""
          echo "ERROR: Required scripts missing. These scripts must never be deleted."
          exit 1
        fi

        echo "All required scripts present"
        echo "================================================================="

    # ====================================================================
    # Repository Setup
    # Checkout PR code and prepare staging branch for validation
    # ====================================================================
    - name: Record start time
      shell: bash
      run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

    - name: Git Checkout PR and into new branch
      shell: bash
      env:
        BASE_REF: ${{ inputs.base_ref }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        echo "::group::Configure git environment"
        git config --global --add safe.directory "$PWD"
        echo "$PATH" >> $GITHUB_PATH
        echo "-------------------------------------------------------------------"

        echo "Fetch base branch and PR"
        echo "  Base branch: ${BASE_REF}"
        echo "  PR number: ${PR_NUMBER}"
        git fetch origin "${BASE_REF}"
        git fetch origin "pull/${PR_NUMBER}/head:pr-${PR_NUMBER}"
        echo "✓ Fetch completed"
        echo "-------------------------------------------------------------------"

        echo "Checkout PR into local branch"
        git checkout "pr-${PR_NUMBER}"
        echo "✓ Checked out pr-${PR_NUMBER}"
        echo "-------------------------------------------------------------------"

        echo "Create staging branch for validation"
        git checkout -b staging-pr-workflow
        echo "✓ Created staging-pr-workflow branch"
        echo "-------------------------------------------------------------------"

        echo "Verify checkout succeeded"
        CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
        CURRENT_COMMIT=$(git rev-parse HEAD)
        COMMIT_MSG=$(git log -1 --pretty=format:"%s")

        if [[ "$CURRENT_BRANCH" != "staging-pr-workflow" ]]; then
          echo "ERROR: Expected branch 'staging-pr-workflow', got '${CURRENT_BRANCH}'"
          exit 1
        fi

        echo "::endgroup::"
        echo "✓ Checkout verification passed"
        echo "  Working directory: $PWD"
        echo "  Branch: ${CURRENT_BRANCH}"
        echo "  Commit: ${CURRENT_COMMIT}"
        echo "  Message: ${COMMIT_MSG}"
        echo "================================================================="

    # ====================================================================
    # Build Tools
    # Download charts-build-scripts binary and automation-core scripts
    # ====================================================================
    - name: (make pull-scripts) Download charts-build-scripts binary
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        echo "::group::make pull-scripts"
        make pull-scripts
        echo "::endgroup::"

    # ====================================================================
    # Validation Phase
    # Run all validation checks - skips expensive steps if only infrastructure files changed
    # ====================================================================
    - name: (./scripts/check-release-yaml) Validate release.yaml format with yq
      shell: bash
      env:
        LOG: "DEBUG"
      run: ./scripts/check-release-yaml

    # ====================================================================
    # Change Detection
    # Determine if package/chart files changed to optimize validation scope
    # ====================================================================
    - name: Check if package validation needed
      id: check_changes
      shell: bash
      env:
        BASE_REF: ${{ inputs.base_ref }}
      run: |
        echo "Checking which files changed in this PR..."

        # Get changed files between base branch and current HEAD
        CHANGED_FILES=$(git diff --name-only origin/${BASE_REF}...HEAD)

        echo "Changed files:"
        echo "$CHANGED_FILES"
        echo ""

        # Check if any package/chart/asset files changed
        if echo "$CHANGED_FILES" | grep -qE '^(packages/|charts/|assets/|index\.yaml|release\.yaml)'; then
          echo "needs_validation=true" >> $GITHUB_OUTPUT
          echo "✓ Package/chart files detected - full validation required"
        else
          echo "needs_validation=false" >> $GITHUB_OUTPUT
          echo "✓ Only infrastructure files changed - skipping package validation"
        fi
        echo "================================================================="

    # ====================================================================
    # Package Build Validation
    # Verify all packages pass the build workflow (dev-v branches only)
    # ====================================================================
    - name: (./scripts/package-ci) Verify all packages pass build workflow
      if: steps.check_changes.outputs.needs_validation == 'true' && contains(inputs.base_ref, 'dev-v')
      shell: bash
      env:
        SKIP_PS: true
        LOG: "DEBUG"
      run: ./scripts/package-ci

    # ====================================================================
    # Docker Image Tag Validation
    # Lint Docker image tags in chart values files
    # ====================================================================
    - name: Validate Docker image tags in charts
      if: steps.check_changes.outputs.needs_validation == 'true'
      shell: bash
      env:
        BASE_BRANCH: ${{ inputs.base_ref }}
      run: ./bin/charts-build-scripts lint-images

    # ====================================================================
    # Release PR Validation
    # Run release-specific validation checkpoints (release-v branches only)
    # ====================================================================
    - name: (make validate-release-charts) Run release PR validation checkpoints
      if: steps.check_changes.outputs.needs_validation == 'true' && contains(inputs.base_ref, 'release-v')
      shell: bash
      env:
        SKIP_PS: true
        GH_TOKEN: ${{ inputs.app_token }}
        BRANCH: ${{ inputs.base_ref }}
        PR_NUMBER: ${{ inputs.pr_number }}
        LOG: "DEBUG"
      run: |
        echo "::group::make validate-release-charts"
        make validate-release-charts
        echo "::endgroup::"

    # ====================================================================
    # Helm Index Validation
    # Verify Helm index matches assets directory state
    # ====================================================================
    - name: (make validate) Verify Helm index matches assets directory
      if: steps.check_changes.outputs.needs_validation == 'true'
      shell: bash
      env:
        SKIP_PS: true
        LOG: "DEBUG"
        BASE_REF: ${{ inputs.base_ref }}
      run: |
        echo "::group::make validate"
        echo "github.base_ref: ${BASE_REF}"
        if [[ "${BASE_REF}" == *release-v* ]]; then
          echo "Validating remote release branch"
          make validate remote=true
        else
          echo "Validating local branch"
          make validate
        fi
        echo "::endgroup::"

    # ====================================================================
    # Docker Image Availability
    # Verify all referenced Docker images exist and are accessible
    # ====================================================================
    - name: (make check-images) Validate Docker image availability
      if: steps.check_changes.outputs.needs_validation == 'true'
      shell: bash
      env:
        SKIP_PS: true
        DOCKER_USERNAME: ${{ inputs.docker_username }}
        DOCKER_PASSWORD: ${{ inputs.docker_password }}
        LOG: "DEBUG"
      run: |
        echo "::group::make check-images"
        make check-images
        echo "::endgroup::"

    # ====================================================================
    # Release Candidate Validation
    # Validate RC version constraints (release-v branches only)
    # ====================================================================
    - name: (make check-rc) Validate release candidate versions
      if: steps.check_changes.outputs.needs_validation == 'true' && contains(inputs.base_ref, 'release-v')
      shell: bash
      env:
        SKIP_PS: true
        LOG: "DEBUG"
      run: |
        echo "::group::make check-rc"
        make check-rc
        echo "::endgroup::"

    # ====================================================================
    # Validation Summary
    # Post PR comment with validation results and duration
    # ====================================================================
    - name: Post build validation summary
      if: success() && inputs.github_token != ''
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        NEEDS_VALIDATION: ${{ steps.check_changes.outputs.needs_validation }}
      run: |
        # Check if token has comment permissions
        if ! gh pr view ${PR_NUMBER} --json number &>/dev/null; then
          echo "WARNING: Cannot access PR (expected for fork PRs) - skipping comment"
          exit 0
        fi

        # Calculate duration
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - BUILD_START_TIME))
        MINUTES=$((DURATION / 60))
        SECONDS=$((DURATION % 60))
        DURATION_STR="${MINUTES}m ${SECONDS}s"

        # Find existing comment to update
        COMMENT_ID=$(gh pr view ${PR_NUMBER} --json comments --jq '.comments[] | select(.body | contains("<!-- build-validation-summary -->")) | .id' | head -1)

        # Build different message based on whether validation ran
        if [[ "${NEEDS_VALIDATION}" == "true" ]]; then
          # Count chart packages
          TGZ_COUNT=$(find assets/ -name "*.tgz" 2>/dev/null | wc -l)

          BODY="<!-- build-validation-summary -->
        ## Build Validation Complete

        **${TGZ_COUNT} charts verified in ${DURATION_STR}**
        **Commit:** ${HEAD_SHA:0:8}

        ### Checks Run
        - Release YAML validation
        - Package CI validation
        - Docker image tag lint
        - Helm index validation
        - Docker image availability"
        else
          BODY="<!-- build-validation-summary -->
        ## Build Validation Complete

        **Infrastructure-only changes - skipped package validation**
        **Commit:** ${HEAD_SHA:0:8}
        **Duration:** ${DURATION_STR}

        ### Checks Run
        - Dependency checksums validation
        - Release YAML validation
        - Packages/, Assets/, Charts/, index.yaml validations skipped (no package/chart files changed)"
        fi

        if [[ -n "$COMMENT_ID" ]]; then
          gh api "repos/{owner}/{repo}/issues/comments/${COMMENT_ID}" -X PATCH -f body="$BODY" || echo "Failed to update comment (expected for fork PRs)"
          echo "Updated existing comment ${COMMENT_ID}"
        else
          gh pr comment ${PR_NUMBER} --body "$BODY" || echo "Failed to post comment (expected for fork PRs)"
          echo "Posted new comment"
        fi
