name: Ship staged
description: >-
  Stamps and checks a chart, checks that its images are pushed, packages and pushes it
  to the staging registry, and tells rancher/charts to ship and index it.

# For the workflow of a chart repository. The steps run in the job of the caller,
# after its checkout, so the OIDC token is the one of the caller and every Vault
# path is under the repository that calls this action. The caller prepares the
# chart folder (the app version and the image tags in it) and may give its version:
# without it, cargueiro chart-version works it out from the appVersion of the
# folder and the versions already released.
# The template at .github/templates/prepare-charts.sh does that for a release tag:
# copy it into the repository of the chart and adapt it. For the charts of a
# family, use the ship-family-staged action.
#
# The caller job needs `id-token: write`, to log in to Vault. The repository
# needs, under its own path in Vault, the staging registry credentials
# (rancher-prime-stg-registry/credentials) and the credentials of the
# rancher-gh-workflow-dispatcher GitHub App
# (github/rancher-gh-workflow-dispatcher/app-credentials). The action makes from
# them a short-lived token for rancher/charts with only actions: write, which
# starts the chart-staged workflow.
#
# With wait: true, the action then waits for that chart-staged run, which passes
# only once its pull request against staging passed Audit and was merged, and
# fails when it fails or does not finish in wait-timeout minutes. The caller can
# then go on knowing the release is in the staging index. The run is read with
# the token of the job: rancher/charts is public.
#
# Everything that can fail on credentials is done before the push, because a
# version that is pushed stays in the registry.

inputs:
  chart-dir:
    description: The folder of the chart, with its Chart.yaml. It is stamped in place.
    required: true
  version:
    description: >-
      The final version of the chart, as in its Chart.yaml (with the +). Leave it
      out to have it worked out from the appVersion and the versions already
      released.
    required: false
    default: ""
  wait:
    description: >-
      "true" to wait for the chart-staged run of rancher/charts that this action
      starts, and fail when it fails. That run passes only once its pull request
      against staging passed Audit and was merged, so when the action ends the
      chart is in the staging index. "false" to end right after starting it.
    required: false
    default: "false"
  wait-timeout:
    description: >-
      With wait, how many minutes to wait for the chart-staged run. A run
      usually ends 1 to 4 minutes after it is started, and can queue behind
      the runs of other repositories. When the time is up the action fails, but
      the run goes on.
    required: false
    default: "15"

outputs:
  chart:
    description: The name of the chart that was pushed.
    value: ${{ steps.push.outputs.chart }}
  reference:
    description: The reference that was pushed.
    value: ${{ steps.push.outputs.reference }}
  version:
    description: The version of the chart that was pushed, the one given or the one worked out.
    value: ${{ steps.push.outputs.version }}
  run-url:
    description: The URL of the chart-staged run of rancher/charts that was started.
    value: ${{ steps.dispatch.outputs.run-url }}

runs:
  using: composite
  steps:
    # Everything that depends on the caller is checked and printed first, so a
    # failure later can be read against it.
    - name: Check the caller
      shell: bash
      env:
        CHART_DIR: ${{ inputs.chart-dir }}
        VERSION: ${{ inputs.version }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        WAIT: ${{ inputs.wait }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
      run: |
        echo "repository:   ${GITHUB_REPOSITORY}"
        echo "workflow:     ${WORKFLOW_REF}"
        echo "ref:          ${GITHUB_REF} (${GITHUB_EVENT_NAME})"
        echo "chart folder: ${CHART_DIR}"
        echo "version:      ${VERSION:-worked out by cargueiro chart-version}"
        echo "wait:         ${WAIT} (at most ${WAIT_TIMEOUT} minutes)"
        echo "Vault paths:  github/repo/${GITHUB_REPOSITORY}/{rancher-prime-stg-registry/credentials,github/rancher-gh-workflow-dispatcher/app-credentials}"
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::The job has no OIDC token, so it cannot log in to Vault. Add 'id-token: write' to the permissions of the job that calls this action."
          exit 1
        fi
        if [ ! -f "${CHART_DIR}/Chart.yaml" ]; then
          echo "::error::There is no Chart.yaml in '${CHART_DIR}'. The chart-dir input is a folder in the workspace of the job, and the checkout must come before this action."
          exit 1
        fi
        case "$WAIT" in
          true | false) ;;
          *)
            echo "::error::The wait input is '${WAIT}', it must be true or false."
            exit 1
            ;;
        esac
        if [ "$WAIT" = true ] && ! [[ "$WAIT_TIMEOUT" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::The wait-timeout input is '${WAIT_TIMEOUT}', it must be a number of minutes."
          exit 1
        fi

    - name: Load the credentials from Vault
      uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # main
      with:
        secrets: |
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials registry | STAGING_REGISTRY ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username | CARGUEIRO_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password | CARGUEIRO_PASSWORD ;
          secret/data/github/repo/${{ github.repository }}/github/rancher-gh-workflow-dispatcher/app-credentials appId | DISPATCHER_APP_ID ;
          secret/data/github/repo/${{ github.repository }}/github/rancher-gh-workflow-dispatcher/app-credentials privateKey | DISPATCHER_PRIVATE_KEY

    # Names only, never values. A name that is empty here, with the Vault step
    # green, means the field is missing from the secret.
    - name: Check the credentials and the registry
      shell: bash
      run: |
        missing=0
        for name in STAGING_REGISTRY CARGUEIRO_USERNAME CARGUEIRO_PASSWORD DISPATCHER_APP_ID DISPATCHER_PRIVATE_KEY; do
          if [ -n "${!name:-}" ]; then
            echo "${name}: loaded"
          else
            echo "::error::${name} is empty after the Vault step. Look for the field in github/repo/${GITHUB_REPOSITORY}/ in Vault."
            missing=1
          fi
        done
        [ "$missing" = 0 ] || exit 1
        echo "registry: ${STAGING_REGISTRY}"
        # cargueiro only applies its rules to this host, so any other would turn them off.
        if [ "$STAGING_REGISTRY" != "stgregistry.suse.com" ]; then
          echo "::error::The registry in Vault is not stgregistry.suse.com, so the push protections would not apply"
          exit 1
        fi

    # The token that starts chart-staged, made from the credentials of the
    # rancher-gh-workflow-dispatcher App. The App can start workflows in the
    # repositories of the organization, so the token is limited here to
    # rancher/charts and to actions: write. It is made before the push, because a
    # version that is pushed stays in the registry.
    - name: Make the token for rancher/charts
      id: charts-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ env.DISPATCHER_APP_ID }}
        private-key: ${{ env.DISPATCHER_PRIVATE_KEY }}
        owner: rancher
        repositories: charts
        permission-actions: write

    # The latest release, while cargueiro changes often. install.sh checks the
    # download against the checksums of that release.
    - name: Install cargueiro
      shell: bash
      run: |
        curl -fsSL https://github.com/rancher/cargueiro/releases/latest/download/install.sh | sh -
        cargueiro version

    - name: Stamp, check, package and push the chart
      id: push
      shell: bash
      env:
        CHART_DIR: ${{ inputs.chart-dir }}
        VERSION: ${{ inputs.version }}
      run: |
        set -Eeuo pipefail
        trap 'echo "::error::This failed: ${BASH_COMMAND}"' ERR

        # Without a version it is worked out from the appVersion of the folder and
        # the versions already released. Nothing is written yet.
        if [ -z "$VERSION" ]; then
          echo "::group::cargueiro chart-version"
          VERSION=$(cargueiro chart-version "$CHART_DIR")
          echo "::endgroup::"
          echo "version:  ${VERSION} (worked out)"
        fi

        # The dry run does every check and writes nothing, so a problem stops the
        # step before the folder is changed.
        echo "::group::cargueiro stamp (dry run)"
        cargueiro stamp "$CHART_DIR" --version "$VERSION" --dry-run --debug >&2
        echo "::endgroup::"
        echo "::group::cargueiro stamp"
        cargueiro stamp "$CHART_DIR" --version "$VERSION" >&2
        echo "::endgroup::"

        echo "::group::cargueiro check chart"
        cargueiro check chart "$CHART_DIR" >&2
        echo "::endgroup::"

        # The images of a release are pushed before its chart: a chart whose images
        # are missing would reach the catalog and break the image lists built from
        # it. Nothing is built or pushed until every image is in the registry.
        echo "::group::cargueiro check-pushed-dependencies"
        cargueiro check-pushed-dependencies "$CHART_DIR"
        echo "::endgroup::"

        echo "::group::cargueiro package"
        archive=$(cargueiro package "$CHART_DIR" --output-dir "$RUNNER_TEMP/ship-staged")
        echo "::endgroup::"
        echo "packaged: ${archive}"

        echo "::group::cargueiro push"
        reference=$(cargueiro push "$archive" --registry "$STAGING_REGISTRY/rancher/catalog")
        echo "::endgroup::"
        echo "pushed:   ${reference}"

        echo "Pushed $reference" >> "$GITHUB_STEP_SUMMARY"

        # oci://<registry>/<chart>:<tag>
        chart=${reference##*/}

        {
          echo "chart=${chart%%:*}"
          echo "reference=$reference"
          echo "version=$VERSION"
        } >> "$GITHUB_OUTPUT"

    # gh workflow run prints the URL of the run it started (gh 2.87.0 and later,
    # when its output is not a terminal), which the wait step follows.
    - name: Tell rancher/charts the chart is staged
      id: dispatch
      shell: bash
      env:
        GH_TOKEN: ${{ steps.charts-token.outputs.token }}
        CHART: ${{ steps.push.outputs.chart }}
        VERSION: ${{ steps.push.outputs.version }}
        WAIT: ${{ inputs.wait }}
      run: |
        echo "Sending chart-staged for ${CHART} ${VERSION} to rancher/charts"
        if ! run_url=$(gh workflow run chart-staged.yaml --repo rancher/charts --ref staging \
          -f "chart=${CHART}" \
          -f "version=${VERSION}"); then
          echo "::error::The dispatch was refused. The token is made from the rancher-gh-workflow-dispatcher App, which must be installed on rancher/charts with actions: write. The chart is already in the registry: start the chart-staged workflow of rancher/charts by hand with 'gh workflow run chart-staged.yaml --repo rancher/charts --ref staging -f chart=${CHART} -f version=${VERSION}', or with Run workflow in its Actions tab."
          exit 1
        fi
        run_id=${run_url##*/}
        if [[ ! "$run_url" =~ ^https://github\.com/rancher/charts/actions/runs/[0-9]+$ ]]; then
          echo "Sent, but gh workflow run did not print the URL of the run (got '${run_url}'). Follow it in the chart-staged workflow of rancher/charts."
          if [ "$WAIT" = true ]; then
            echo "::error::Cannot wait for a run whose URL is unknown. It needs gh 2.87.0 or later, and this is '$(gh --version | head -n1)'."
            exit 1
          fi
          exit 0
        fi
        echo "Sent. Follow it at ${run_url}"
        echo "Sent chart-staged for ${CHART} ${VERSION} to rancher/charts: ${run_url}" >> "$GITHUB_STEP_SUMMARY"
        {
          echo "run-id=${run_id}"
          echo "run-url=${run_url}"
        } >> "$GITHUB_OUTPUT"

    # chart-staged passes only once its pull request passed Audit and was
    # squash-merged into staging; otherwise it fails and leaves the pull request
    # open. A step of a composite action takes no timeout-minutes, so the
    # deadline is kept here.
    - name: Wait for rancher/charts to ship the chart
      if: inputs.wait == 'true'
      shell: bash
      env:
        # rancher/charts is public, so the token of the job can read its runs,
        # whatever the permissions of the job.
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ steps.dispatch.outputs.run-id }}
        RUN_URL: ${{ steps.dispatch.outputs.run-url }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        INTERVAL: 20
      run: |
        echo "Waiting at most ${WAIT_TIMEOUT} minutes for ${RUN_URL}"
        deadline=$((SECONDS + WAIT_TIMEOUT * 60))
        failures=0
        while :; do
          # The API can answer 500 for a run that was just made, so a few failed
          # reads in a row are let through.
          if state=$(gh api "repos/rancher/charts/actions/runs/${RUN_ID}" --jq '"\(.status) \(.conclusion // "none")"'); then
            failures=0
            case "$state" in
              "completed success")
                echo "chart-staged passed: its pull request was merged into staging."
                echo "rancher/charts merged it into staging: ${RUN_URL}" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              completed\ *)
                echo "::error::chart-staged finished with '${state#completed }', so its pull request was not merged. Look at ${RUN_URL}"
                exit 1
                ;;
              *) echo "chart-staged is ${state%% *}" ;;
            esac
          elif ((++failures >= 10)); then
            echo "::error::Could not read ${RUN_URL} ${failures} times in a row."
            exit 1
          fi
          if ((SECONDS >= deadline)); then
            echo "::error::chart-staged did not finish in ${WAIT_TIMEOUT} minutes. It goes on without this job: follow it at ${RUN_URL}"
            exit 1
          fi
          sleep "$INTERVAL"
        done
