name: Ship staged
description: >-
  Stamps, checks, packages and pushes a chart to the staging registry, and tells
  rancher/charts to ship and index it.

# For the workflow of a chart repository. The steps run in the job of the caller,
# after its checkout, so the OIDC token is the one of the caller and every Vault
# path is under the repository that calls this action. The caller prepares the
# chart folder (the app version and the image tags in it) and gives its version.
#
# The caller job needs `id-token: write`, to log in to Vault. The repository
# needs, under its own path in Vault, the staging registry credentials
# (rancher-prime-stg-registry/credentials) and the credentials of a GitHub App
# installed on rancher/charts that can send a repository_dispatch
# (github/app-credentials).
#
# Everything that can fail on credentials is done before the push, because a
# version that is pushed stays in the registry.

inputs:
  chart-dir:
    description: The folder of the chart, with its Chart.yaml. It is stamped in place.
    required: true
  version:
    description: The final version of the chart, as in its Chart.yaml (with the +).
    required: true

outputs:
  chart:
    description: The name of the chart that was pushed.
    value: ${{ steps.push.outputs.chart }}
  reference:
    description: The reference that was pushed.
    value: ${{ steps.push.outputs.reference }}

runs:
  using: composite
  steps:
    # Everything that depends on the caller is checked and printed first, so a
    # failure later can be read against it.
    - name: Check the caller
      shell: bash
      env:
        CHART_DIR: ${{ inputs.chart-dir }}
        VERSION: ${{ inputs.version }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
      run: |
        echo "repository:   ${GITHUB_REPOSITORY}"
        echo "workflow:     ${WORKFLOW_REF}"
        echo "ref:          ${GITHUB_REF} (${GITHUB_EVENT_NAME})"
        echo "chart folder: ${CHART_DIR}"
        echo "version:      ${VERSION}"
        echo "Vault paths:  github/repo/${GITHUB_REPOSITORY}/{rancher-prime-stg-registry/credentials,github/app-credentials}"
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::The job has no OIDC token, so it cannot log in to Vault. Add 'id-token: write' to the permissions of the job that calls this action."
          exit 1
        fi
        if [ ! -f "${CHART_DIR}/Chart.yaml" ]; then
          echo "::error::There is no Chart.yaml in '${CHART_DIR}'. The chart-dir input is a folder in the workspace of the job, and the checkout must come before this action."
          exit 1
        fi

    - name: Load the credentials from Vault
      uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # main
      with:
        secrets: |
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials registry | STAGING_REGISTRY ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username | CARGUEIRO_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password | CARGUEIRO_PASSWORD ;
          secret/data/github/repo/${{ github.repository }}/github/app-credentials appId | APP_ID ;
          secret/data/github/repo/${{ github.repository }}/github/app-credentials privateKey | PRIVATE_KEY

    # Names only, never values. A name that is empty here, with the Vault step
    # green, means the field is missing from the secret.
    - name: Check the credentials and the registry
      shell: bash
      run: |
        missing=0
        for name in STAGING_REGISTRY CARGUEIRO_USERNAME CARGUEIRO_PASSWORD APP_ID PRIVATE_KEY; do
          if [ -n "${!name:-}" ]; then
            echo "${name}: loaded"
          else
            echo "::error::${name} is empty after the Vault step. Look for the field in github/repo/${GITHUB_REPOSITORY}/ in Vault."
            missing=1
          fi
        done
        [ "$missing" = 0 ] || exit 1
        echo "registry: ${STAGING_REGISTRY}"
        # cargueiro only applies its rules to this host, so any other would turn them off.
        if [ "$STAGING_REGISTRY" != "stgregistry.suse.com" ]; then
          echo "::error::The registry in Vault is not stgregistry.suse.com, so the push protections would not apply"
          exit 1
        fi

    # Token for rancher/charts only, to send the repository_dispatch. It is made
    # before the push so that a failure here leaves nothing in the registry.
    - name: Create the token for rancher/charts
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
      id: app-token
      with:
        app-id: ${{ env.APP_ID }}
        private-key: ${{ env.PRIVATE_KEY }}
        repositories: |
          charts

    - name: Log the GitHub App
      shell: bash
      env:
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
      run: echo "GitHub App ${APP_SLUG}, installation ${INSTALLATION_ID}, token for rancher/charts"

    # The latest release, while cargueiro changes often. install.sh checks the
    # download against the checksums of that release.
    - name: Install cargueiro
      shell: bash
      run: |
        curl -fsSL https://github.com/rancher/cargueiro/releases/latest/download/install.sh | sh -
        cargueiro version

    - name: Stamp, check, package and push the chart
      id: push
      shell: bash
      env:
        CHART_DIR: ${{ inputs.chart-dir }}
        VERSION: ${{ inputs.version }}
      run: |
        set -Eeuo pipefail
        trap 'echo "::error::This failed: ${BASH_COMMAND}"' ERR
        echo "::group::cargueiro stamp"
        cargueiro stamp "$CHART_DIR" --version "$VERSION" >&2
        echo "::endgroup::"
        echo "::group::cargueiro check chart"
        cargueiro check chart "$CHART_DIR" >&2
        echo "::endgroup::"
        archive=$(cargueiro package "$CHART_DIR" --output-dir "$RUNNER_TEMP/ship-staged")
        echo "packaged: ${archive}"
        reference=$(cargueiro push "$archive" --registry "$STAGING_REGISTRY/rancher/catalog")
        echo "pushed:   ${reference}"
        echo "Pushed $reference" >> "$GITHUB_STEP_SUMMARY"
        # oci://<registry>/<chart>:<tag>
        chart=${reference##*/}
        echo "chart=${chart%%:*}" >> "$GITHUB_OUTPUT"
        echo "reference=$reference" >> "$GITHUB_OUTPUT"

    - name: Tell rancher/charts the chart is staged
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        CHART: ${{ steps.push.outputs.chart }}
        VERSION: ${{ inputs.version }}
      run: |
        echo "Sending chart-staged for ${CHART} ${VERSION} to rancher/charts"
        if ! gh api "repos/rancher/charts/dispatches" \
          -f event_type=chart-staged \
          -f "client_payload[chart]=${CHART}" \
          -f "client_payload[version]=${VERSION}"; then
          echo "::error::The dispatch was refused. The App must be installed on rancher/charts with the Contents: write permission. The chart is already in the registry: send the event again with 'gh api repos/rancher/charts/dispatches -f event_type=chart-staged -f client_payload[chart]=${CHART} -f client_payload[version]=${VERSION}', or start the chart-staged workflow of rancher/charts by hand with the same two values."
          exit 1
        fi
        echo "Sent. Follow it in the chart-staged workflow of rancher/charts."
        echo "Sent chart-staged for ${CHART} ${VERSION} to rancher/charts." >> "$GITHUB_STEP_SUMMARY"
