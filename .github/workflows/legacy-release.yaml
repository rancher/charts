name: Legacy release

# Releases to production the legacy versions that staging has: the charts of Rancher
# 2.10 to 2.15 that legacy-import.yaml of the staging branch imported. Each chart is
# copied from the staging registry to the production one by the digest of its
# manifest, and its entry goes to legacy/, so that the index of production lists it. It
# opens a pull request with the result against the production branch, which does not
# take direct pushes, and does not merge it.
#
# It can run again at any time: a version that is in production is not copied again,
# and when nothing is new no pull request is opened. A version that fails does not
# stop the others: what went through is in the pull request, and the run fails at the
# end, with what did not go through in its log. A tag that holds other content in
# production is never replaced, and is reported as a conflict.
#
# The workflow and its script are on the staging branch, the default one, and it checks
# out both branches: the production branch has no workflows, because it is what
# customers see. Start it with
#
#   gh workflow run legacy-release.yaml --repo rancher/charts --ref staging
#
# Releasing every family copies more than one run can finish, so release one family at a
# time with family. It installs the latest release of cargueiro, and cargueiro_version names
# another one.

on:
  workflow_dispatch:
    inputs:
      family:
        description: "Release only this family (default: all of them, which is more than one run can copy)"
        required: false
      dry_run:
        description: "Only report what would be released"
        type: boolean
        default: false
      cargueiro_version:
        description: "The release of cargueiro to install, such as v0.2.7 (default: the latest)"
        required: false

permissions: {}

# A second run waits for the first one: both would copy the same charts.
concurrency:
  group: legacy-release
  cancel-in-progress: false

jobs:
  import:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # to push the branch of the pull request
      id-token: write # to log in to Vault with the OIDC token
    steps:
      # The production branch, with the credentials the checkout leaves: the last
      # steps push a branch with them.
      - name: Check out the production branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production
          persist-credentials: true # zizmor: ignore[artipacked] -- a later step pushes a branch

      - name: Check out the staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          path: .staging
          persist-credentials: false

      # The staging catalog does not let anonymous readers see anything, so the
      # charts are read with its credentials, which cargueiro takes from
      # CARGUEIRO_USERNAME and CARGUEIRO_PASSWORD. They are written to production
      # with CARGUEIRO_PRODUCTION_USERNAME and CARGUEIRO_PRODUCTION_PASSWORD. Each pair
      # is only sent to its own registry. A dry run reads no registry, so it needs
      # none of them.
      - name: Load the registry and App credentials from Vault
        if: ${{ !inputs.dry_run }}
        uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username | CARGUEIRO_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password | CARGUEIRO_PASSWORD ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials username | CARGUEIRO_PRODUCTION_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials password | CARGUEIRO_PRODUCTION_PASSWORD ;
            secret/data/github/repo/${{ github.repository }}/github/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/app-credentials privateKey | PRIVATE_KEY

      # install.sh checks the download against the checksums of the release.
      - name: Install cargueiro
        env:
          CARGUEIRO_VERSION: ${{ inputs.cargueiro_version }}
        run: curl -fsSL https://github.com/rancher/cargueiro/releases/latest/download/install.sh | sh -

      - name: Release the legacy versions
        id: release
        env:
          # The inputs are data, not trusted input: they go through the environment
          # and the script checks them.
          FAMILY: ${{ inputs.family }}
          DRY_RUN: ${{ inputs.dry_run }}
          STAGING_DIR: ${{ github.workspace }}/.staging
          REPORT_FILE: ${{ runner.temp }}/report.txt
          RESULT_FILE: ${{ runner.temp }}/result.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The script is the one of the staging checkout: production has none.
          "$STAGING_DIR/.github/scripts/legacy-release.sh"
          cat "$RESULT_FILE" >> "$GITHUB_OUTPUT"

      # A pull request that GITHUB_TOKEN opens does not start the checks, so it is
      # opened with the token of the App that auto-bump uses.
      - name: Create the token that opens the pull request
        if: steps.release.outputs.commits != '0'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: pr-token
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}

      # The production branch only takes pull requests, so the result goes to a branch
      # of its own. It is never overwritten: a re-run fails on the push while the
      # branch of an earlier run is still there. The pull request is left open for
      # someone to look at, and is not merged by this workflow.
      - name: Open a pull request to the production branch
        if: steps.release.outputs.commits != '0'
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          RUN_ID: ${{ github.run_id }}
          FAMILY: ${{ inputs.family }}
          REPORT_FILE: ${{ runner.temp }}/report.txt
        run: |
          branch="legacy-release/${RUN_ID}"
          title="[production] release the legacy versions${FAMILY:+ - $FAMILY}"
          git push origin "HEAD:refs/heads/${branch}"
          {
            echo "Releases the legacy versions that staging has."
            echo
            echo "Each chart was copied from the staging registry to the production one, with the manifest as it is, and its entry is in \`legacy/\`."
            echo
            echo '```'
            sed -n '/^released [0-9]* versions/,$p' "$REPORT_FILE"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base production --head "$branch" \
            --title "$title" --body-file "$RUNNER_TEMP/body.md"

      # What did not go through is a failure of the run, after the pull request with
      # what did.
      - name: Fail when a version did not go through
        if: steps.release.outputs.status != '0'
        env:
          STATUS: ${{ steps.release.outputs.status }}
        run: |
          echo "::error::cargueiro release finished with status ${STATUS}: see the report above for the versions that failed or are in conflict"
          exit 1
