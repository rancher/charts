name: Next Release Tracker

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Semicolon-separated release versions (e.g., 2.14.4;2.13.9)'
        required: true
        type: string
      month:
        description: 'Release month (e.g., June)'
        required: true
        type: string
      year:
        description: 'Release year (e.g., 2026)'
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  create-releases:
    runs-on: ubuntu-latest
    container: ghcr.io/rancher/ci-image/charts:20260618-20
    steps:
      - name: Display Workflow Context
        run: |
          echo "================================================================="
          echo "Next Release Tracker Workflow"
          echo "================================================================="
          echo "Versions:        ${{ github.event.inputs.versions }}"
          echo "Month:           ${{ github.event.inputs.month }}"
          echo "Year:            ${{ github.event.inputs.year }}"
          echo "Triggered by:    ${{ github.actor }}"
          echo "Repository:      ${{ github.repository }}"
          echo "================================================================="

      - name: Validate inputs
        run: |
          # Validate versions input
          if [[ -z "${{ github.event.inputs.versions }}" ]]; then
            echo "Error: versions input is empty" >&2
            exit 1
          fi

          # Validate month input
          if [[ -z "${{ github.event.inputs.month }}" ]]; then
            echo "Error: month input is empty" >&2
            exit 1
          fi

          # Validate year input
          if [[ -z "${{ github.event.inputs.year }}" ]]; then
            echo "Error: year input is empty" >&2
            exit 1
          fi

          # Validate versions format (basic check for semicolon-separated)
          IFS=';' read -ra VERSIONS <<< "${{ github.event.inputs.versions }}"
          if [[ ${#VERSIONS[@]} -eq 0 ]]; then
            echo "Error: No versions found in input" >&2
            exit 1
          fi

          # Validate each version matches pattern (e.g., 2.14.4)
          for version in "${VERSIONS[@]}"; do
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: Invalid version format: '$version' (expected X.Y.Z)" >&2
              exit 1
            fi
          done

          echo "Input validation passed"
          echo "Found ${#VERSIONS[@]} version(s) to process"

      - name: Checkout automation-core
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: automation-core
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify yq availability
        run: |
          if ! command -v yq &> /dev/null; then
            echo "Error: yq not found" >&2
            exit 1
          fi
          echo "yq version: $(yq --version)"

      - name: Delete old release YAML files
        run: |
          # Check if any .yaml files exist in release/ directory
          if ls release/*.yaml 1> /dev/null 2>&1; then
            echo "Deleting old release YAML files..."
            git rm release/*.yaml || {
              echo "Error: Failed to remove old release files" >&2
              exit 1
            }

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git commit -m "chore(release-tracker): delete old release files for new release cycle" || {
              echo "Error: Failed to commit deleted files" >&2
              exit 1
            }

            git push || {
              echo "Error: Failed to push deletion commit" >&2
              exit 1
            }
            echo "Successfully deleted old release files"
          else
            echo "No existing release YAML files to delete"
          fi

      - name: Create new release YAML files
        run: |
          IFS=';' read -ra VERSIONS <<< "${{ github.event.inputs.versions }}"

          for version in "${VERSIONS[@]}"; do
            echo "Creating release file for version: $version"
            cp templates/release-versions.yaml "release/${version}.yaml"
            echo "Created release/${version}.yaml"
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add release/ || {
            echo "Error: Failed to stage release files" >&2
            exit 1
          }

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "Warning: No new release files were created"
            exit 1
          fi

          git commit -m "chore(release-tracker): create release files for ${{ github.event.inputs.versions }}" || {
            echo "Error: Failed to commit new release files" >&2
            exit 1
          }

          git push || {
            echo "Error: Failed to push new release files" >&2
            exit 1
          }

          echo "Successfully created and pushed release files"

  create-issues:
    needs: create-releases
    runs-on: ubuntu-latest
    container: ghcr.io/rancher/ci-image/charts:20260618-20
    steps:
      - name: Checkout automation-core
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: automation-core

      - name: Verify gh CLI availability
        run: |
          if ! command -v gh &> /dev/null; then
            echo "Error: gh CLI not found" >&2
            exit 1
          fi
          echo "gh CLI version: $(gh --version | head -1)"

      - name: Create parent issue
        id: parent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read template
          if [[ ! -f templates/charts-release-issue.md ]]; then
            echo "Error: templates/charts-release-issue.md not found" >&2
            exit 1
          fi

          template=$(cat templates/charts-release-issue.md)
          if [[ -z "$template" ]]; then
            echo "Error: templates/charts-release-issue.md is empty" >&2
            exit 1
          fi

          # Replace version placeholder with bullet list
          IFS=';' read -ra VERSIONS <<< "${{ github.event.inputs.versions }}"
          version_list=""
          for version in "${VERSIONS[@]}"; do
            version_list="${version_list}- ${version}\n"
          done
          body=$(echo "$template" | sed "s|<<-- VERSION_INPUTS -->>|${version_list}|")

          # Create parent issue
          issue_url=$(gh issue create \
            --title "[charts] Release ${{ github.event.inputs.month }} ${{ github.event.inputs.year }}" \
            --body "$body" \
            --label "release-tracking" \
            --repo ${{ github.repository }})

          issue_number=$(echo "$issue_url" | grep -oE '[0-9]+$')

          if [[ -z "$issue_number" ]] || [[ "$issue_number" == "0" ]]; then
            echo "Error: Failed to extract valid issue number from: $issue_url" >&2
            exit 1
          fi

          echo "parent_number=$issue_number" >> $GITHUB_OUTPUT
          echo "Created parent issue: $issue_url"

      - name: Create sub-issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          parent_number="${{ steps.parent.outputs.parent_number }}"

          # Verify template exists
          if [[ ! -f templates/charts-release-subissue.md ]]; then
            echo "Error: templates/charts-release-subissue.md not found" >&2
            exit 1
          fi

          IFS=';' read -ra VERSIONS <<< "${{ github.event.inputs.versions }}"
          subissue_count=0

          for version in "${VERSIONS[@]}"; do
            # Read sub-issue template
            template=$(cat templates/charts-release-subissue.md)
            if [[ -z "$template" ]]; then
              echo "Error: templates/charts-release-subissue.md is empty" >&2
              exit 1
            fi

            # Replace version placeholder
            body=$(echo "$template" | sed "s|<--version-->|${version}|g")

            # Prepend parent link
            body="Parent: #${parent_number}\n\n${body}"

            issue_url=$(gh issue create \
              --title "${version}" \
              --body "$body" \
              --label "release-tracking" \
              --repo ${{ github.repository }})

            issue_number=$(echo "$issue_url" | grep -oE '[0-9]+$')

            if [[ -z "$issue_number" ]] || [[ "$issue_number" == "0" ]]; then
              echo "Error: Failed to create sub-issue for version ${version}" >&2
              exit 1
            fi

            echo "Created sub-issue #${issue_number} for ${version}"
            ((subissue_count++))
          done

          # Sanity check: ensure at least one sub-issue was created
          if [[ $subissue_count -eq 0 ]]; then
            echo "Error: No sub-issues were created" >&2
            exit 1
          fi

          echo "Successfully created ${subissue_count} sub-issue(s)"
