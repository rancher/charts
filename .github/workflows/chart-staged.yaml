name: Chart staged

# Ships a chart that another repository pushed to the staging registry: writes
# its entry and logo, pulls its archive, rebuilds the index, and opens a pull
# request with the result against the staging branch, which does not take direct
# pushes. The sender is a workflow that sends this event right after its push:
#
#   gh api "repos/rancher/charts/dispatches" \
#     -f event_type=chart-staged \
#     -f "client_payload[chart]=<name>" \
#     -f "client_payload[version]=<chart version>"
#
# A family of charts that are released together is sent with its name instead of
# a chart, after every chart of the family was pushed, and all of them are
# shipped in one pull request:
#
#   gh api "repos/rancher/charts/dispatches" \
#     -f event_type=chart-staged \
#     -f "client_payload[family]=<family>" \
#     -f "client_payload[version]=<chart version>"
#
# Send a chart or a family, never both. It can also be started by hand, with the
# same inputs.
#
# A repository_dispatch only starts the file that is on the default branch.

on:
  repository_dispatch:
    types: [chart-staged]
  workflow_dispatch:
    inputs:
      chart:
        description: "Chart name (or a family, not both)"
        required: false
      family:
        description: "Family name, to ship all its charts (or a chart, not both)"
        required: false
      version:
        description: "Chart version, as in its Chart.yaml (with the +)"
        required: true

permissions: {}

# Every run publishes to the same branch, so they wait for each other.
concurrency:
  group: chart-staged
  cancel-in-progress: false

env:
  # TODO: add back the pinned CARGUEIRO_VERSION and CARGUEIRO_SHA256 (and install
  # that version) once the project is in production.

  # Where the charts are pushed to. It is fixed here, never taken from the event.
  REGISTRY: stgregistry.suse.com/rancher/catalog

jobs:
  ship-and-index:
    name: Ship and index
    runs-on: ubuntu-latest
    # The audit has 30 minutes to finish, see the last step.
    timeout-minutes: 45
    permissions:
      contents: write # to push the branch of the pull request
      id-token: write # to log in to Vault with the OIDC token
    steps:
      # The staging branch, with the credentials the checkout leaves: cargueiro
      # uses them to ask the remote for its latest commit, and the last step to
      # push its branch.
      - name: Check out the staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          persist-credentials: true # zizmor: ignore[artipacked] -- ship checks the remote, and the last step pushes a branch

      # The staging catalog does not let anonymous readers see anything, so ship
      # and index read it with the registry credentials. cargueiro takes them
      # from CARGUEIRO_USERNAME and CARGUEIRO_PASSWORD, and they are only sent
      # to the registry it reads. The App credentials are the ones auto-bump uses
      # to open its pull requests.
      - name: Load the registry and App credentials from Vault
        uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username | CARGUEIRO_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password | CARGUEIRO_PASSWORD ;
            secret/data/github/repo/${{ github.repository }}/github/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/app-credentials privateKey | PRIVATE_KEY

      # The latest release, while cargueiro changes often. install.sh checks the
      # download against the checksums of that release. Pin a version and its
      # sha256 again once it is stable.
      - name: Install cargueiro
        run: curl -fsSL https://github.com/rancher/cargueiro/releases/latest/download/install.sh | sh -

      - name: Ship and index
        env:
          # The event is data, not trusted input: it goes through the environment
          # and the script checks it.
          CHART: ${{ github.event.client_payload.chart || inputs.chart }}
          FAMILY: ${{ github.event.client_payload.family || inputs.family }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
          REPORT_FILE: ${{ runner.temp }}/report.txt
        run: .github/scripts/chart-staged.sh

      # A pull request that GITHUB_TOKEN opens does not start the Audit workflow,
      # so it is opened with the token of the App that auto-bump uses.
      - name: Create the token that opens the pull request
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: pr-token
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}

      # The staging branch only takes pull requests, so the result goes to a
      # branch of its own, named after the chart or family and the version. The branch is never
      # overwritten: a re-run fails on the push while the branch of an earlier
      # run is still there, so close its pull request and delete it first.
      - name: Open a pull request to the staging branch
        id: pr
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          CHART: ${{ github.event.client_payload.chart || inputs.chart }}
          FAMILY: ${{ github.event.client_payload.family || inputs.family }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
          REPORT_FILE: ${{ runner.temp }}/report.txt
        run: |
          # The step before checked that only one of them is set.
          name="${CHART:-$FAMILY}"
          branch="chart-staged/${name}-${VERSION//+/-}"
          title="[staging] ship ${name} ${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add entries assets index.yaml
          {
            echo "$title"
            echo
            cat "$REPORT_FILE"
          } > "$RUNNER_TEMP/message.txt"
          git commit --file "$RUNNER_TEMP/message.txt"
          git push origin "$branch"
          url=$(gh pr create --base staging --head "$branch" --title "$title" --body-file "$REPORT_FILE")
          {
            echo "url=$url"
            echo "title=$title"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # The Audit workflow checks the pull request against the staging registry.
      # When it passes, the pull request is approved by the auto-approve App, a
      # different identity from the one that opened it, and squash-merged at the
      # commit that was audited. When it fails, or does not finish, the pull
      # request stays open for someone to look at and this run fails.
      - name: Create the token that approves and merges
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: approve-token
        with:
          app-id: ${{ secrets.AUTO_APPROVE_APP_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}

      - name: Merge when the audit passes
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          APPROVE_TOKEN: ${{ steps.approve-token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: .github/scripts/chart-staged-merge.sh
