name: Chart withdraw

# Withdraws a published version from the staging catalog: marks its entry
# withdrawn, takes it out of index.yaml, and opens a pull request with the result
# against the staging branch, which does not take direct pushes. When the Audit
# check passes, the pull request is approved and squash-merged, as chart-staged
# does for a chart that is shipped.
#
# It accepts only:
#   - a chart that has no family (one released alone, with no crd or extra chart
#     next to it), or
#   - a family of charts, by the name of its main chart,
# and always one exact version. A chart that belongs to a family of several
# charts is never withdrawn alone, and neither is a list, a range or a wildcard
# of versions: the run stops before it changes anything. The checks are in
# .github/scripts/chart-withdraw.sh.
#
# A run only says what it would do, unless dry_run is turned off:
#
#   gh workflow run chart-withdraw.yaml --repo rancher/charts --ref staging \
#     -f family=rancher-monitoring \
#     -f version=111.0.0+up80.9.1-rancher.23 \
#     -f reason="critical CVE in the grafana image" \
#     -f dry_run=false
#
# Send a chart or a family, never both. A version that is in production stays
# there: this only takes it off the staging catalog.

on:
  workflow_dispatch:
    inputs:
      chart:
        description: "Chart name, for a chart that has no family (or a family, not both)"
        required: false
      family:
        description: "Family name, which is the name of its main chart (or a chart, not both)"
        required: false
      version:
        description: "The one version to withdraw, as in its entry (with the +)"
        required: true
      reason:
        description: "Why, for the pull request"
        required: true
      dry_run:
        description: "Only say what would be withdrawn, and open nothing"
        type: boolean
        default: true

permissions: {}

# Every run publishes to the staging branch, so they wait for each other, and for
# chart-staged, which writes the same index.yaml.
concurrency:
  group: chart-staged
  cancel-in-progress: false

jobs:
  withdraw:
    name: Withdraw
    runs-on: ubuntu-latest
    # The audit has 30 minutes to finish, see the last step.
    timeout-minutes: 45
    permissions:
      contents: write # to push the branch of the pull request
      id-token: write # to log in to Vault with the OIDC token
    steps:
      # The staging branch, with the credentials the checkout leaves: the last
      # step uses them to push its branch.
      - name: Check out the staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          persist-credentials: true # zizmor: ignore[artipacked] -- the last step pushes a branch

      # The App credentials are the ones auto-bump uses to open its pull
      # requests. Withdrawing a version pulls nothing, so the registry
      # credentials are not loaded.
      - name: Load the App credentials from Vault
        if: ${{ !inputs.dry_run }}
        uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/app-credentials privateKey | PRIVATE_KEY

      # The latest release, while cargueiro changes often. install.sh checks the
      # download against the checksums of that release.
      - name: Install cargueiro
        run: curl -fsSL https://github.com/rancher/cargueiro/releases/latest/download/install.sh | sh -

      - name: Withdraw and index
        env:
          # The event is data, not trusted input: it goes through the environment
          # and the script checks it.
          CHART: ${{ inputs.chart }}
          FAMILY: ${{ inputs.family }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          REPORT_FILE: ${{ runner.temp }}/report.txt
        run: .github/scripts/chart-withdraw.sh

      # A pull request that GITHUB_TOKEN opens does not start the Audit workflow,
      # so it is opened with the token of the App that auto-bump uses.
      - name: Create the token that opens the pull request
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: pr-token
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}

      # The staging branch only takes pull requests, so the result goes to a
      # branch of its own, named after the chart or family and the version. The
      # branch is never overwritten: a re-run fails on the push while the branch
      # of an earlier run is still there, so close its pull request and delete it
      # first.
      - name: Open a pull request to the staging branch
        if: ${{ !inputs.dry_run }}
        id: pr
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          CHART: ${{ inputs.chart }}
          FAMILY: ${{ inputs.family }}
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
          REPORT_FILE: ${{ runner.temp }}/report.txt
        run: |
          # The step before checked that only one of them is set.
          name="${CHART:-$FAMILY}"
          branch="chart-withdraw/${name}-${VERSION//+/-}"
          title="[staging] withdraw ${name} ${VERSION}"
          {
            printf 'Reason: %s\n\n' "$REASON"
            cat "$REPORT_FILE"
          } > "$RUNNER_TEMP/body.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add entries index.yaml
          {
            echo "$title"
            echo
            cat "$RUNNER_TEMP/body.txt"
          } > "$RUNNER_TEMP/message.txt"
          git commit --file "$RUNNER_TEMP/message.txt"
          git push origin "$branch"
          url=$(gh pr create --base staging --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.txt")
          {
            echo "url=$url"
            echo "title=$title"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # The Audit workflow checks the pull request. When it passes, the pull
      # request is approved by the auto-approve App, a different identity from
      # the one that opened it, and squash-merged at the commit that was audited.
      # When it fails, or does not finish, the pull request stays open for
      # someone to look at and this run fails.
      - name: Create the token that approves and merges
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: approve-token
        with:
          app-id: ${{ secrets.AUTO_APPROVE_APP_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}

      - name: Merge when the audit passes
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          APPROVE_TOKEN: ${{ steps.approve-token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: .github/scripts/chart-staged-merge.sh
