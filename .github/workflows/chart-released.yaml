name: Chart released

# Releases to production the charts that staging has. It will run `cargueiro release`
# when that command can release the charts of the new system; today it only releases
# the legacy versions, which legacy-import.yaml does.
#
# NOT IMPLEMENTED. This only says so: it changes nothing and reads no secret. It is
# on the staging branch, the default one, like every workflow: the production branch
# is what customers see, so it has none.

on:
  workflow_dispatch:

permissions: {}

# Every release writes the same branch, so they wait for each other.
concurrency:
  group: chart-released
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Releasing the charts of the new system is not implemented yet
        run: echo "Nothing is released, see the comments of this workflow."
