name: Manual Trigger for Auto Bump

# This file only registers the workflow on the default branch: GitHub starts a
# workflow_dispatch only if the file exists there. The bump itself runs from the
# file of the branch chosen in "Use workflow from". The dev-v2.X branches have
# their own copy of this workflow and of auto-bump.yaml, and this branch has
# neither the Makefile nor the scripts the bump needs. Started from this branch
# it only fails, and says why.

on:
  workflow_dispatch:
    inputs:
      chart:
        description: "Chart name"
        required: true
        default: "example-chart"
      branch:
        description: "Branch name (only dev branches); (must be the same as 'Use workflow from' branch)"
        required: true
        default: "dev-v2.15"
      version-override:
        description: "Version Override (optional): disable the bump version auto calculation, forcing it to be a patch or minor version bump"
        required: false
        type: choice
        options:
          - auto
          - patch
          - minor
        default: 'auto'
      multi-rc:
        description: "Multi-RC (optional): allow multiple-RC versions for this bump, the default behavior is to remove the previous RC version"
        required: false
        type: boolean
        default: false
      new-chart:
        description: "New Chart (optional): used to introduce a net new chart at rancher/charts"
        required: false
        type: boolean
        default: false
      auto-merge:
        description: "Auto-merge (optional): automatically merge PR when CI passes"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  wrong-branch:
    name: Run this from a dev-v2.X branch
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run on this branch
        run: |
          echo "::error title=Wrong branch::Run this workflow from the dev-v2.X branch that is being bumped ('Use workflow from'), not from ${GITHUB_REF_NAME}."
          exit 1
