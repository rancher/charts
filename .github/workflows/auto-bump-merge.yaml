name: Auto Merge Auto-Bump PRs

on:
  pull_request:
    types: [labeled]

jobs:
  auto-approve-and-merge:
    name: Auto Approve and Enable Auto-Merge
    runs-on: ubuntu-latest
    # Only auto-merge PRs with auto-merge label targeting dev branches.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'auto-merge') &&
      startsWith(github.event.pull_request.base.ref, 'dev-v') &&
      startsWith(github.event.pull_request.head.ref, 'auto-bump_') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.user.login == 'rancher-pr-and-push-webhook[bot]' &&
      github.event.pull_request.state == 'open'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Create Auto-Approve App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.AUTO_APPROVE_APP_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Approve PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr review "$PR_NUMBER" \
            --repo "$REPO" \
            --approve \
            --body "Auto-approving: PR was generated by auto-bump."

      - name: Wait for Validate workflow to pass
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Waiting for Validate workflow to pass..."

          while true; do
            STATUS=$(gh pr checks "$PR_NUMBER" --repo "$REPO" --json name,state --jq '
              map(select(.name == "Validate")) | .[0].state // "PENDING"
            ')

            echo "Validate workflow status: $STATUS"

            # If PENDING or IN_PROGRESS, keep waiting
            if [[ "$STATUS" == "PENDING" ]] || [[ "$STATUS" == "IN_PROGRESS" ]]; then
              echo "Validate workflow still running..."
              sleep 120
              continue
            fi

            # If SUCCESS, break
            if [[ "$STATUS" == "SUCCESS" ]]; then
              echo "Validate workflow passed"
              break
            fi

            # If FAILURE or ERROR, exit
            if [[ "$STATUS" == "FAILURE" ]] || [[ "$STATUS" == "ERROR" ]]; then
              echo "Validate workflow failed: $STATUS"
              exit 1
            fi

            sleep 30
          done

      - name: Merge PR via API
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh api \
            --method PUT \
            "/repos/$REPO/pulls/$PR_NUMBER/merge" \
            -f sha="$COMMIT_SHA" \
            -f merge_method=squash \
            -f commit_title="Auto-merge: $PR_TITLE"
