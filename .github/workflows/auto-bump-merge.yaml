name: Auto Merge Auto-Bump PRs

on:
  pull_request:
    types: [labeled, opened]

jobs:
  auto-approve-and-merge:
    name: Auto Approve and Enable Auto-Merge
    runs-on: ubuntu-latest
    # Only auto-merge PRs with auto-merge label targeting dev branches.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'auto-merge') &&
      startsWith(github.event.pull_request.base.ref, 'dev-v') &&
      startsWith(github.event.pull_request.head.ref, 'auto-bump_') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.user.login == 'rancher-pr-and-push-webhook[bot]' &&
      github.event.pull_request.state == 'open'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr review "$PR_NUMBER" \
            --repo "$REPO" \
            --approve \
            --body "Auto-approving: CI passed and PR was generated by auto-bump."

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --auto \
            --squash
