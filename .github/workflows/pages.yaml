name: Pages

# Publishes index.yaml and the logos of the production branch with GitHub Pages, so
# that the catalog can also be read over HTTP: the index lists the charts with oci://
# URLs. Then it reads the index from the address Pages gives, to see that it is served.
#
# NOT ACTIVE. Nothing is deployed from this repository yet: the steps that do it
# are commented out, so only the echo runs. Before it is turned on, decide the Pages
# settings of the repository and the address of the site.
#
# This file is on the staging branch, and the production branch has no workflows, so a
# push to production starts nothing. What starts the deploy is a dispatch, or a
# schedule that deploys when the index changed. Pages can also deploy straight from
# the production branch, with GitHub's own build and no workflow at all; then this
# file is not needed, and a _config.yml on production keeps entries/ and legacy/ out
# of the site.

on:
  workflow_dispatch:
  # schedule:
