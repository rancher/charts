name: Audit production

# Checks every pull request to the production branch against the production registry
# its versions are pulled from: the url of each version, the manifest its tag names in
# the registry, and the digest of its archive, for the legacy versions too, which are
# all the production branch has at the start. It reads and writes nothing. A pull
# request fails when any check does not pass, and the report says which and why.
#
# The production branch has no workflows, because customers see it, so this one is
# here, on the staging branch, and starts on pull_request_target: the event that runs
# the workflow of the default branch for a pull request to another branch. The pull
# request is only data here. It is checked out for cargueiro to read index.yaml and
# legacy/, and nothing in it is run. The registry is read without credentials, so the
# job has no secrets to lose.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- the pull request is only read as data, see above
    branches: [production]

permissions: {}

concurrency:
  group: audit-production-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The name of the job is the name of the check that the ruleset of the production
  # branch requires.
  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the pull request
    steps:
      # The commit of the pull request, with no credentials left in the checkout. Nothing
      # of what it holds is executed: the next steps only give it to cargueiro as a folder.
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # audit --production and --legacy are in a release that is not the latest yet, so
      # the release is named. TODO: take it out and install the latest one when it is.
      - name: Install cargueiro
        env:
          CARGUEIRO_VERSION: v0.2.7-rc.4
        run: curl -fsSL https://github.com/rancher/cargueiro/releases/latest/download/install.sh | sh -

      - name: Audit the repository
        run: cargueiro audit --repo . --production --legacy
