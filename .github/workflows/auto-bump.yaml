name: Auto Chart Bump

on:
  workflow_call:
    inputs:
      chart:
        description: "Chart name"
        required: true
        type: string
      branch:
        description: "Branch name (dev-v* or release-v*)"
        required: true
        type: string
      version-override:
        description: "Version override (auto/patch/minor)"
        required: false
        type: string
        default: 'auto'
      multi-rc:
        description: "Allow multiple RC versions"
        required: false
        type: boolean
        default: false
      new-chart:
        description: "New chart flag"
        required: false
        type: boolean
        default: false


jobs:
  process-event:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # ====================================================================
      # INPUT VALIDATION AND PARSING
      # ====================================================================
      - name: Display workflow inputs
        run: |
          echo "================================================================="
          echo "Auto Chart Bump - Workflow Inputs"
          echo "================================================================="
          echo "CHART:            ${{ inputs.chart }}"
          echo "BRANCH:           ${{ inputs.branch }}"
          echo "VERSION_OVERRIDE: ${{ inputs.version-override }}"
          echo "MULTI_RC:         ${{ inputs.multi-rc }}"
          echo "NEW_CHART:        ${{ inputs.new-chart }}"
          echo "================================================================="

      # ====================================================================
      # REPOSITORY SETUP
      # ====================================================================
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure Git for Commit
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # ====================================================================
      # DEPENDENCY INSTALLATION
      # ====================================================================
      - name: (make pull-scripts) Download charts-build-scripts binary
        run: make pull-scripts

      # ====================================================================
      # CHART BUMP EXECUTION
      # ====================================================================
      - name: (./bin/charts-build-scripts chart-bump) Execute chart version bump
        run: |
          LOG="DEBUG" ./bin/charts-build-scripts chart-bump \
            --package="${{ inputs.chart }}" \
            --branch="${{ inputs.branch }}" \
            --override="${{ inputs.version-override }}" \
            --multi-rc="${{ inputs.multi-rc }}" \
            --new-chart="${{ inputs.new-chart }}"

      - name: Read bump version from config file
        id: read_bump_version
        run: |
          echo "Reading data from config/bump_version.json"
          JSON_FILE="config/bump_version.json"

          if [[ ! -f "$JSON_FILE" ]]; then
            echo "Error: $JSON_FILE not found!"
            exit 1
          fi

          NEW_VERSION=$(jq -r '.new_version' "$JSON_FILE")
          if [[ -z "$NEW_VERSION" || "$NEW_VERSION" == "null" ]]; then
            echo "Error: Could not read '.new_version' or value is null/empty in $JSON_FILE"
            exit 1
          fi
          echo "New version: $NEW_VERSION"
          cat "$JSON_FILE"

          CHARTS_ARRAY_JSON=$(jq -c '.charts' "$JSON_FILE")
          echo $CHARTS_ARRAY_JSON

          echo "BUMP_VERSION=$NEW_VERSION" >> $GITHUB_ENV


      - name: Verify git changes were generated
        run: |
          git status
          if [ -z "$(git status --porcelain)" ]; then
            echo "No bump detected"
            exit 1
          fi
          echo "Changes detected, proceeding..."

      # ====================================================================
      # SECRETS MANAGEMENT (OIDC vault authentication)
      # ====================================================================
      - name: Load App Credentials from Vault
        uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/app-credentials privateKey | PRIVATE_KEY

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app-token
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}

      # ====================================================================
      # BRANCH AND PULL REQUEST CREATION
      # ====================================================================
      - name: Set branch name
        id: set_branch
        run: |
          echo 'NEW_BRANCH="auto-bump_${{ inputs.chart }}_${{ env.BUMP_VERSION }}"' >> $GITHUB_ENV

      - name: Display bump configuration
        run: |
          echo "================================================================="
          echo "Chart Bump Configuration"
          echo "================================================================="
          echo "BRANCH:       ${{ inputs.branch }}"
          echo "CHART:        ${{ inputs.chart }}"
          echo "NEW_BRANCH:   ${{ env.NEW_BRANCH }}"
          echo "BUMP_VERSION: ${{ env.BUMP_VERSION }}"
          echo "MULTI_RC:     ${{ inputs.multi-rc }}"
          echo "NEW_CHART:    ${{ inputs.new-chart }}"
          echo "================================================================="

      - name: Create and checkout new branch
        run: |
          git checkout -b "${{ env.NEW_BRANCH}}"

      - name: Commit and push changes
        run: |
          git add .
          git commit -m "auto bump chart: ${{ inputs.chart }} version: ${{ env.BUMP_VERSION }}"
          git push origin "${{ env.NEW_BRANCH}}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --base "${{ inputs.branch }}" \
            --head "${{ env.NEW_BRANCH }}" \
            --title "[${{ inputs.branch }}] auto: ${{ inputs.chart }} ${{ env.BUMP_VERSION }}" \
            --body-file '.github/auto_bump_template.md'
