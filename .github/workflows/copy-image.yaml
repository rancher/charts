name: Copy image

# THROWAWAY: delete it when the images are copied. It stays in the repository, and it is switched on and off with
#
#   gh workflow enable copy-image.yaml --repo rancher/charts
#   gh workflow disable copy-image.yaml --repo rancher/charts
#
# so that it does not need to be commented out. It only runs for nicholasSUSE (see the job).
#
#   gh workflow run copy-image.yaml --repo rancher/charts --ref staging \
#     -f source=registry.suse.com/rancher/cluster-api-controller:v1.14.4_turtles.1 \
#     -f target=stgregistry.suse.com/rancher/cluster-api-controller:v1.14.4_turtles.1

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Image to read: <registry>/<repository>:<tag>"
        required: true
      target:
        description: "Image to write: <registry>/<repository>:<tag>"
        required: true

permissions: {}

jobs:
  copy:
    # Only the person who started the run can use it: anyone with write access can dispatch the workflow, and the
    # job is skipped for everybody else. A re-run counts as the person who re-runs it.
    if: ${{ github.triggering_actor == 'nicholasSUSE' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # to log in to Vault
    steps:
      # Only the staging registry needs credentials, to write. The source is read anonymously.
      - name: Load the staging registry credentials from Vault
        uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username | TARGET_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password | TARGET_PASSWORD

      - name: Copy the image
        env:
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ inputs.target }}
        run: |
          command -v skopeo || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          skopeo copy --all --preserve-digests \
            --dest-creds "${TARGET_USERNAME}:${TARGET_PASSWORD}" \
            "docker://${SOURCE}" "docker://${TARGET}"
          skopeo inspect --raw --creds "${TARGET_USERNAME}:${TARGET_PASSWORD}" "docker://${TARGET}" | sha256sum
          skopeo inspect --raw "docker://${SOURCE}" | sha256sum
