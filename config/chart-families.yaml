# Chart Family Definitions
#
# Purpose: Maps chart family names to their component charts.
# Used by: Release tracker GHAs, validation workflows
#
# Structure:
#   family-name:
#     - chart-name-1
#     - chart-name-2
#
# Rules:
# - Family name used in release YAML tracking
# - All charts in family release together at same version
# - QA/UnRC/Released status applies to entire family
# - Single-chart families list only themselves
#
# Maintenance:
# - Add new chart families as they are introduced
# - Update when charts are added/removed from families
# - Keep alphabetically sorted by family name

