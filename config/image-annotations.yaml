# Charts exempt from the helm.sh/images annotation check
# (.github/scripts/check-image-annotations.sh). List only charts that deploy
# no workloads, such as CRD-only charts. A chart that ships even one image,
# for example a CRD chart with an install Job, must carry the annotation.
exempt:
  - elemental-crd
  - epinio-crd
  - fleet-crd
  - harvester-rbac
  - longhorn-crd
  - neuvector-crd
  - rancher-aks-operator-crd
  - rancher-backup-crd
  - rancher-cis-benchmark-crd
  - rancher-compliance-crd
  - rancher-eks-operator-crd
  - rancher-gke-operator-crd
  - rancher-logging-crd
  - rancher-supportability-review-crd
  - sriov-crd
  - ui-plugin-operator-crd
